title: "EK125 Slides"
author: "Stormy Attaway, Brian DePasquale, Christine Mulvey, Kenn Sebesta"
repository:
  url: "https://github.com/BU-EK125/EK125-slides"
  branch: main

sphinx:
  config:
    # _slides_build/ is generated by build_slides.sh (not committed --
    # see .gitignore) and copied verbatim to the site root, so each
    # deck lands at <DeckName>/index.html for _toc.yml's url: entries
    # to link straight to.
    html_extra_path: ["_slides_build"]

# README.md, CONTRIBUTING.md, and CONVENTIONS.md are repo/instructor
# documentation, not student-facing content, so they're excluded from
# the public site too. archive/ and slides/ (marimo .py sources) aren't
# book content either. notebooks/*.ipynb are raw artifacts for the
# Colab button to open, not meant to be built/executed/rendered as book
# pages themselves.
exclude_patterns: ["archive/*", "archive/**/*", "slides/*", "slides/**/*", "notebooks/*", "notebooks/**/*", "README.md", "CONTRIBUTING.md", "CONVENTIONS.md"]
