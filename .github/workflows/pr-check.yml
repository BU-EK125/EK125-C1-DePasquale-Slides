name: pr-check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Jupyter Book, marimo, and uv
        # uv is required by `marimo export html-wasm` to resolve each
        # deck's imports into a WASM-compatible dependency set.
        run: pip install --force-reinstall --no-cache-dir jupyter-book==1.0.2 marimo uv

      - name: Export marimo slide decks
        run: ./build_slides.sh

      - name: Verify notebooks/ is committed and up to date
        # notebooks/*.ipynb (what the Colab button opens) must be real,
        # committed files -- Colab reads them straight from GitHub, not
        # from this ephemeral CI build. git status (not git diff) so this
        # also catches a brand-new deck whose .ipynb was never committed
        # at all, not just an edited one that's now out of sync.
        run: |
          if [ -n "$(git status --porcelain notebooks/)" ]; then
            git status --porcelain notebooks/
            echo "::error::notebooks/*.ipynb is out of date with slides/*.py. Run ./build_slides.sh locally and commit the result."
            exit 1
          fi

      - name: Build the Jupyter Book
        run: jb build .
