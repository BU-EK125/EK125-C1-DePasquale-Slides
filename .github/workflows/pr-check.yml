name: pr-check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Jupyter Book and marimo
        run: pip install --force-reinstall --no-cache-dir jupyter-book==1.0.2 marimo

      - name: Export marimo slide decks
        run: ./build_slides.sh

      - name: Build the Jupyter Book
        run: jb build .
