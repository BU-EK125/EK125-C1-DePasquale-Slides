name: deploy-book

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Jupyter Book, marimo, uv, and tools
        # uv is required by `marimo export html-wasm` to resolve each
        # deck's imports into a WASM-compatible dependency set.
        run: pip install --force-reinstall --no-cache-dir jupyter-book==1.0.2 marimo uv

      - name: Export marimo slide decks
        run: ./build_slides.sh

      - name: Build the Jupyter Book
        run: jb build .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          # keep_files preserves anything already on gh-pages that this
          # deploy doesn't touch -- specifically pr-preview/pr-N/
          # directories from pr-check.yml's preview deploys, which a
          # plain full-branch-replace (ghp-import -f) would wipe out.
          keep_files: true
